    name: "${rain_nom_zone_active}"
    id: rain_sens_zone_active
    icon: "mdi:sprinkler-variant"

  - platform: template
    name: "${rain_nom_temps_restant}"
    id: rain_sens_temps_restant
    icon: "mdi:timer-sand"
    unit_of_measurement: "s"
    state_class: measurement

  # Anciennement "Cycles d'arrosage" : ce n'est pas un compteur
