# Arrosage programmé (Rain Pure Vision) V5.6
# Base V5.1 + P0/P1 (restart, from, re-check BLE, durée, stop BLE)
# V5.5 : entrée facultative « État de la vanne » → ouverture confirmée
# (sinon alerte) et fin d'arrosage réelle (sinon fermeture forcée).
# V5.6 : pluie prévue sur les N prochaines heures (prévisions horaires,
# repli sur le journalier) ; pluie tombée récemment (capteur de cumul) ;
# correction : avec une entité météo, humidité du sol et budget à 0 %
# n'étaient plus jamais vérifiés.
# Notifications : UNIQUEMENT notify.send_message + entité notify.*
# (pas d'action notify.iphone_* / notify.mobile_app_* — HA 2026 les refuse)
# Pas de sections, pas d'ancres YAML — formulaire blueprint compatible.

blueprint:
  name: Arrosage programmé (Rain Pure Vision) - V5.6
  description: >
    Arrosage planifié avec budget saisonnier, résilience Bluetooth,
    sécurités matérielles et notifications iPhone via notify.send_message.

    Importer via Paramètres → Automatisations → Blueprints (pas via
    Appareils / Intégrations).
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  input:
    schedule_entity:
      name: Planning (helper Schedule)
      selector:
        entity:
          domain: schedule
    zone_number_entity:
      name: "Entité : Zone à arroser"
      selector:
        entity:
          domain: number
    duration_number_entity:
      name: "Entité : Durée arrosage manuel"
      selector:
        entity:
          domain: number
    start_button_entity:
      name: "Entité : bouton Arrosage manuel"
      selector:
        entity:
          domain: button
    stop_button_entity:
      name: "Entité : bouton Fermer la vanne"
      selector:
        entity:
          domain: button
    valve_sensor_entity:
      name: "Entité : État de la vanne (Facultatif, recommandé)"
      description: >
        Permet de vérifier que la vanne s'est réellement ouverte (alerte
        sinon) et de notifier la fin réelle de l'arrosage (fermeture forcée
        si la vanne reste ouverte). Vide = comportement des versions
        précédentes (notifications sans vérification).
      default: ""
      selector:
        entity:
          domain: binary_sensor
    ble_sensor_entity:
      name: "Entité : Connexion BLE au boîtier"
      selector:
        entity:
          domain: binary_sensor
    rain_sensor_entity:
      name: "Entité : Capteur de pluie détecté"
      selector:
        entity:
          domain: binary_sensor
    pause_sensor_entity:
      name: "Entité : Pause active (Facultatif)"
      default: ""
      selector:
        entity:
          domain: binary_sensor
    fault_sensor_entity:
      name: "Entité : Défaut matériel (Facultatif)"
      default: ""
      selector:
        entity:
          domain: binary_sensor
    weather_entity:
      name: Entité météo (Facultatif)
      default: ""
      selector:
        entity:
          domain: weather
          multiple: false
    precipitation_threshold:
      name: Seuil de pluie prévue (mm)
      description: Arrosage annulé si la pluie prévue atteint ce seuil (0 = ignoré).
      default: 3
      selector:
        number:
          min: 0
          max: 50
          step: 0.5
          unit_of_measurement: mm
          mode: box
    forecast_hours:
      name: Horizon des prévisions (heures)
      description: >
        Cumul de pluie prévue sur les N prochaines heures (prévisions
        horaires). Si l'entité météo n'a pas de prévisions horaires : pluie
        prévue pour la journée.
      default: 12
      selector:
        number:
          min: 1
          max: 48
          step: 1
          unit_of_measurement: h
          mode: box
    rain_accumulation_entity:
      name: Pluie tombée récemment (Facultatif)
      description: >
        Capteur donnant le cumul de pluie sur une période glissante (ex.
        48 h). Avec un pluviomètre dont le cumul journalier repart à zéro à
        minuit, créer une entrée « Statistiques » sur ce cumul :
        caractéristique « Somme des différences (non négatives) », âge
        maximal 48 h, taille d'échantillon élevée (ex. 1000).
      default: ""
      selector:
        entity:
          domain: sensor
          multiple: false
    rain_accumulation_threshold:
      name: Seuil de pluie tombée (mm)
      description: Arrosage annulé si la pluie tombée atteint ce seuil (0 = ignoré).
      default: 5
      selector:
        number:
          min: 0
          max: 100
          step: 0.5
          unit_of_measurement: mm
          mode: box
    soil_moisture_entity:
      name: Capteur d'humidité du sol (Facultatif)
      default: ""
      selector:
        entity:
          domain: sensor
          device_class: moisture
          multiple: false
    soil_moisture_threshold:
      name: Seuil d'humidité du sol (%)
      default: 40
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: '%'
          mode: slider
    zone_value:
      name: Numéro de zone à arroser
      selector:
        number:
          min: 1
          max: 32
          step: 1
          mode: box
    duration_value:
      name: Durée d'arrosage de base (minutes)
      selector:
        number:
          min: 1
          max: 60
          step: 1
          unit_of_measurement: min
          mode: box
    budget_entity:
      name: Coefficient saisonnier / Budget (Facultatif)
      description: "Entité (input_number) en pourcentage. Vide = 100 %. 0 % = pas d'arrosage."
      default: ""
      selector:
        entity:
          domain: input_number
    notify_entity:
      name: Entité de notification iOS/Android
      description: "Ex. notify.iphone_de_florent. Lisser vide pour ignorer les alertes."
      default: ""
      selector:
        entity:
          domain: notify
    notify_on_success:
      name: Notifier lors du démarrage
      default: true
      selector:
        boolean:
    notify_on_skip:
      name: Notifier les annulations (pluie, pause, sol, budget…)
      default: true
      selector:
        boolean:
    notify_on_complete:
      name: Notifier la fin d'arrosage / fermeture de vanne
      default: true
      selector:
        boolean:

trigger:
  - platform: state
    entity_id: !input schedule_entity
    from: "off"
    to: "on"
    id: "start"
  - platform: state
    entity_id: !input schedule_entity
    from: "on"
    to: "off"
    id: "stop"

action:
  - choose:
      - conditions:
          - condition: trigger
            id: "start"
        sequence:
          - alias: "Initialiser les variables"
            variables:
              weather_entity_id: !input weather_entity
              rain_threshold: !input precipitation_threshold
              soil_entity_id: !input soil_moisture_entity
              soil_threshold: !input soil_moisture_threshold
              pause_entity_id: !input pause_sensor_entity
              fault_entity_id: !input fault_sensor_entity
              b_entity: !input budget_entity
              notify_ent: !input notify_entity
              notify_succ: !input notify_on_success
              notify_on_skip: !input notify_on_skip
              notify_on_complete: !input notify_on_complete
              z_val: !input zone_value
              d_val_base: !input duration_value
              rain_entity_id: !input rain_sensor_entity
              ble_entity_id: !input ble_sensor_entity
              schedule_entity_id: !input schedule_entity
              duration_entity_id: !input duration_number_entity
              valve_entity_id: !input valve_sensor_entity
              forecast_hours_val: !input forecast_hours
              rain_acc_entity_id: !input rain_accumulation_entity
              rain_acc_threshold: !input rain_accumulation_threshold
              pluie_prevue_mm: -1
              pluie_prevue_libelle: ""

          - alias: "Récupérer les prévisions météo"
            if:
              - condition: template
                value_template: "{{ weather_entity_id | default('') not in ['', 'none', none] }}"
            then:
              - variables:
                  pluie_prevue_mm: -1
                  meteo_features: "{{ state_attr(weather_entity_id, 'supported_features') | int(0) }}"
              # Prévisions horaires si l'entité les fournit (bit 2) : cumul
              # sur les N prochaines heures (heure en cours comprise).
              - if:
                  - condition: template
                    value_template: "{{ meteo_features | bitwise_and(2) > 0 }}"
                then:
                  - action: weather.get_forecasts
                    continue_on_error: true
                    target:
                      entity_id: "{{ weather_entity_id }}"
                    data:
                      type: hourly
                    response_variable: rep_horaire
                  # Recopie dans les variables du niveau principal (une
                  # variable de réponse peut rester locale à ce bloc).
                  - variables:
                      pluie_prevue_mm: >
                        {% set fc = rep_horaire[weather_entity_id].forecast | default([])
                           if rep_horaire is defined and rep_horaire is mapping and weather_entity_id in rep_horaire
                           else [] %}
                        {% set debut = now() - timedelta(hours=1) %}
                        {% set fin = now() + timedelta(hours=forecast_hours_val | int(12)) %}
                        {% set ns = namespace(total=0, n=0) %}
                        {% for f in fc %}
                          {% set t = as_datetime(f.datetime) %}
                          {% if t is not none and debut <= t < fin %}
                            {% set ns.total = ns.total + (f.precipitation | default(0) | float(0)) %}
                            {% set ns.n = ns.n + 1 %}
                          {% endif %}
                        {% endfor %}
                        {{ (ns.total | round(1)) if ns.n > 0 else -1 }}
                      pluie_prevue_libelle: "dans les {{ forecast_hours_val | int(12) }} prochaines heures"
              # Sinon (ou en cas d'échec) : prévision journalière du jour.
              - if:
                  - condition: template
                    value_template: "{{ pluie_prevue_mm | float(-1) < 0 and meteo_features | bitwise_and(1) > 0 }}"
                then:
                  - action: weather.get_forecasts
                    continue_on_error: true
                    target:
                      entity_id: "{{ weather_entity_id }}"
                    data:
                      type: daily
                    response_variable: rep_jour
                  - variables:
                      pluie_prevue_mm: >
                        {% set fc = rep_jour[weather_entity_id].forecast | default([])
                           if rep_jour is defined and rep_jour is mapping and weather_entity_id in rep_jour
                           else [] %}
                        {{ (fc[0].precipitation | default(0) | float(0)) if fc | count > 0 else -1 }}
                      pluie_prevue_libelle: "aujourd'hui"

          - alias: "Évaluer les conditions d'annulation (avant BLE)"
            variables:
              d_val: >
                {% set base = d_val_base | float(1) %}
                {% set budget = 100.0 %}
                {% if b_entity | default('') not in ['', 'none', none] and states(b_entity) | is_number %}
                  {% set budget = states(b_entity) | float(100) %}
                {% endif %}
                {% if budget <= 0 %}
                  0
                {% else %}
                  {% set raw = (base * budget / 100) | round(0, 'half-up') | int %}
                  {% set minutes = [raw, 1] | max %}
                  {% set cap = state_attr(duration_entity_id, 'max') %}
                  {% set cap = cap | float(60) if cap is not none else 60 %}
                  {{ [minutes, cap | int] | min }}
                {% endif %}
              msg_prefix: "Zone {{ z_val }} ({{ d_val }} min) :"
              skip_blob: >
                {% set ns = namespace(title='', message='') %}
                {% set pluie_tombee = states(rain_acc_entity_id) | float(-1)
                   if rain_acc_entity_id | default('') not in ['', 'none', none] else -1 %}
                {% set pluie_prevue = pluie_prevue_mm | float(-1) %}
                {% if fault_entity_id | default('') not in ['', 'none', none] and is_state(fault_entity_id, 'on') %}
                  {% set ns.title = '🚨 Défaut matériel' %}
                  {% set ns.message = msg_prefix ~ ' Un défaut électrique est détecté sur la vanne !' %}
                {% elif pause_entity_id | default('') not in ['', 'none', none] and is_state(pause_entity_id, 'on') %}
                  {% set ns.title = '⏸️ Arrosage annulé' %}
                  {% set ns.message = msg_prefix ~ ' Le boîtier est en mode Pause.' %}
                {% elif is_state(rain_entity_id, 'on') %}
                  {% set ns.title = '🌧️ Arrosage annulé' %}
                  {% set ns.message = msg_prefix ~ ' Le capteur de pluie est actif.' %}
                {% elif rain_acc_threshold | float(0) > 0 and pluie_tombee >= rain_acc_threshold | float(0) %}
                  {% set ns.title = '🌧️ Arrosage annulé' %}
                  {% set ns.message = msg_prefix ~ ' ' ~ pluie_tombee ~ ' mm de pluie tombés récemment (seuil : ' ~ rain_acc_threshold ~ ' mm).' %}
                {% elif rain_threshold | float(0) > 0 and pluie_prevue >= rain_threshold | float(0) %}
                  {% set ns.title = '🌦️ Arrosage annulé' %}
                  {% set ns.message = msg_prefix ~ ' ' ~ pluie_prevue ~ ' mm de pluie prévus ' ~ pluie_prevue_libelle ~ ' (seuil : ' ~ rain_threshold ~ ' mm).' %}
                {% elif soil_entity_id | default('') not in ['', 'none', none]
                    and states(soil_entity_id) | is_number
                    and (states(soil_entity_id) | float(0)) >= (soil_threshold | float(0)) %}
                  {% set ns.title = '🌱 Arrosage annulé' %}
                  {% set ns.message = msg_prefix ~ ' Sol suffisamment humide (' ~ states(soil_entity_id) ~ '%).' %}
                {% elif d_val | int(0) <= 0 %}
                  {% set ns.title = '💧 Arrosage annulé' %}
                  {% set ns.message = msg_prefix ~ ' Budget saisonnier à 0 %, arrosage ignoré.' %}
                {% endif %}
                {{ ns.title }}|||{{ ns.message }}
              skip_title: "{{ skip_blob.split('|||')[0] }}"
              skip_message: "{{ skip_blob.split('|||')[1] if skip_blob.split('|||') | length > 1 else '' }}"

          - alias: "Annuler si exclusion (avant BLE)"
            if:
              - condition: template
                value_template: "{{ skip_title | default('') | trim != '' }}"
            then:
              - if:
                  - condition: template
                    value_template: "{{ notify_on_skip and notify_ent | default('') not in ['', 'none', none] }}"
                then:
                  - action: notify.send_message
                    continue_on_error: true
                    target:
                      entity_id: "{{ notify_ent }}"
                    data:
                      title: "{{ skip_title }}"
                      message: "{{ skip_message }}"
              - stop: "{{ skip_message }}"

          - alias: "Attendre le BLE si nécessaire"
            if:
              - condition: template
                value_template: "{{ not is_state(ble_entity_id, 'on') }}"
            then:
              - alias: "Attente reconnexion BLE (max 10 min) ou fin de créneau"
                wait_for_trigger:
                  - platform: state
                    entity_id: !input ble_sensor_entity
                    to: "on"
                    id: ble_on
                  - platform: state
                    entity_id: !input schedule_entity
                    from: "on"
                    to: "off"
                    id: schedule_off
                timeout:
                  minutes: 10
                continue_on_timeout: true

          - alias: "Abort si le créneau est terminé pendant l'attente"
            if:
              - condition: template
                value_template: "{{ not is_state(schedule_entity_id, 'on') }}"
            then:
              - if:
                  - condition: template
                    value_template: "{{ notify_on_skip and notify_ent | default('') not in ['', 'none', none] }}"
                then:
                  - action: notify.send_message
                    continue_on_error: true
                    target:
                      entity_id: "{{ notify_ent }}"
                    data:
                      title: "⏰ Arrosage annulé"
                      message: "{{ msg_prefix }} Le créneau du planning s'est terminé pendant l'attente Bluetooth."
              - stop: "Créneau terminé pendant l'attente BLE."

          - alias: "Abort si le BLE n'est toujours pas joignable"
            if:
              - condition: template
                value_template: "{{ not is_state(ble_entity_id, 'on') }}"
            then:
              - if:
                  - condition: template
                    value_template: "{{ notify_ent | default('') not in ['', 'none', none] }}"
                then:
                  - action: notify.send_message
                    continue_on_error: true
                    target:
                      entity_id: "{{ notify_ent }}"
                    data:
                      title: "📡 Arrosage impossible"
                      message: "{{ msg_prefix }} Boîtier injoignable en Bluetooth après 10 minutes d'attente."
              - stop: "Arrêt de l'automatisation : BLE injoignable."

          - alias: "Re-récupérer les prévisions météo (après attente)"
            if:
              - condition: template
                value_template: "{{ weather_entity_id | default('') not in ['', 'none', none] }}"
            then:
              - variables:
                  pluie_prevue_mm: -1
                  meteo_features: "{{ state_attr(weather_entity_id, 'supported_features') | int(0) }}"
              # Prévisions horaires si l'entité les fournit (bit 2) : cumul
              # sur les N prochaines heures (heure en cours comprise).
              - if:
                  - condition: template
                    value_template: "{{ meteo_features | bitwise_and(2) > 0 }}"
                then:
                  - action: weather.get_forecasts
                    continue_on_error: true
                    target:
                      entity_id: "{{ weather_entity_id }}"
                    data:
                      type: hourly
                    response_variable: rep_horaire
                  # Recopie dans les variables du niveau principal (une
                  # variable de réponse peut rester locale à ce bloc).
                  - variables:
                      pluie_prevue_mm: >
                        {% set fc = rep_horaire[weather_entity_id].forecast | default([])
                           if rep_horaire is defined and rep_horaire is mapping and weather_entity_id in rep_horaire
                           else [] %}
                        {% set debut = now() - timedelta(hours=1) %}
                        {% set fin = now() + timedelta(hours=forecast_hours_val | int(12)) %}
                        {% set ns = namespace(total=0, n=0) %}
                        {% for f in fc %}
                          {% set t = as_datetime(f.datetime) %}
                          {% if t is not none and debut <= t < fin %}
                            {% set ns.total = ns.total + (f.precipitation | default(0) | float(0)) %}
                            {% set ns.n = ns.n + 1 %}
                          {% endif %}
                        {% endfor %}
                        {{ (ns.total | round(1)) if ns.n > 0 else -1 }}
                      pluie_prevue_libelle: "dans les {{ forecast_hours_val | int(12) }} prochaines heures"
              # Sinon (ou en cas d'échec) : prévision journalière du jour.
              - if:
                  - condition: template
                    value_template: "{{ pluie_prevue_mm | float(-1) < 0 and meteo_features | bitwise_and(1) > 0 }}"
                then:
                  - action: weather.get_forecasts
                    continue_on_error: true
                    target:
                      entity_id: "{{ weather_entity_id }}"
                    data:
                      type: daily
                    response_variable: rep_jour
                  - variables:
                      pluie_prevue_mm: >
                        {% set fc = rep_jour[weather_entity_id].forecast | default([])
                           if rep_jour is defined and rep_jour is mapping and weather_entity_id in rep_jour
                           else [] %}
                        {{ (fc[0].precipitation | default(0) | float(0)) if fc | count > 0 else -1 }}
                      pluie_prevue_libelle: "aujourd'hui"

          - alias: "Évaluer les conditions d'annulation (après BLE)"
            variables:
              d_val: >
                {% set base = d_val_base | float(1) %}
                {% set budget = 100.0 %}
                {% if b_entity | default('') not in ['', 'none', none] and states(b_entity) | is_number %}
                  {% set budget = states(b_entity) | float(100) %}
                {% endif %}
                {% if budget <= 0 %}
                  0
                {% else %}
                  {% set raw = (base * budget / 100) | round(0, 'half-up') | int %}
                  {% set minutes = [raw, 1] | max %}
                  {% set cap = state_attr(duration_entity_id, 'max') %}
                  {% set cap = cap | float(60) if cap is not none else 60 %}
                  {{ [minutes, cap | int] | min }}
                {% endif %}
              msg_prefix: "Zone {{ z_val }} ({{ d_val }} min) :"
              skip_blob: >
                {% set ns = namespace(title='', message='') %}
                {% set pluie_tombee = states(rain_acc_entity_id) | float(-1)
                   if rain_acc_entity_id | default('') not in ['', 'none', none] else -1 %}
                {% set pluie_prevue = pluie_prevue_mm | float(-1) %}
                {% if fault_entity_id | default('') not in ['', 'none', none] and is_state(fault_entity_id, 'on') %}
                  {% set ns.title = '🚨 Défaut matériel' %}
                  {% set ns.message = msg_prefix ~ ' Un défaut électrique est détecté sur la vanne !' %}
                {% elif pause_entity_id | default('') not in ['', 'none', none] and is_state(pause_entity_id, 'on') %}
                  {% set ns.title = '⏸️ Arrosage annulé' %}
                  {% set ns.message = msg_prefix ~ ' Le boîtier est en mode Pause.' %}
                {% elif is_state(rain_entity_id, 'on') %}
                  {% set ns.title = '🌧️ Arrosage annulé' %}
                  {% set ns.message = msg_prefix ~ ' Le capteur de pluie est actif.' %}
                {% elif rain_acc_threshold | float(0) > 0 and pluie_tombee >= rain_acc_threshold | float(0) %}
                  {% set ns.title = '🌧️ Arrosage annulé' %}
                  {% set ns.message = msg_prefix ~ ' ' ~ pluie_tombee ~ ' mm de pluie tombés récemment (seuil : ' ~ rain_acc_threshold ~ ' mm).' %}
                {% elif rain_threshold | float(0) > 0 and pluie_prevue >= rain_threshold | float(0) %}
                  {% set ns.title = '🌦️ Arrosage annulé' %}
                  {% set ns.message = msg_prefix ~ ' ' ~ pluie_prevue ~ ' mm de pluie prévus ' ~ pluie_prevue_libelle ~ ' (seuil : ' ~ rain_threshold ~ ' mm).' %}
                {% elif soil_entity_id | default('') not in ['', 'none', none]
                    and states(soil_entity_id) | is_number
                    and (states(soil_entity_id) | float(0)) >= (soil_threshold | float(0)) %}
                  {% set ns.title = '🌱 Arrosage annulé' %}
                  {% set ns.message = msg_prefix ~ ' Sol suffisamment humide (' ~ states(soil_entity_id) ~ '%).' %}
                {% elif d_val | int(0) <= 0 %}
                  {% set ns.title = '💧 Arrosage annulé' %}
                  {% set ns.message = msg_prefix ~ ' Budget saisonnier à 0 %, arrosage ignoré.' %}
                {% endif %}
                {{ ns.title }}|||{{ ns.message }}
              skip_title: "{{ skip_blob.split('|||')[0] }}"
              skip_message: "{{ skip_blob.split('|||')[1] if skip_blob.split('|||') | length > 1 else '' }}"

          - alias: "Annuler si exclusion (après BLE)"
            if:
              - condition: template
                value_template: "{{ skip_title | default('') | trim != '' }}"
            then:
              - if:
                  - condition: template
                    value_template: "{{ notify_on_skip and notify_ent | default('') not in ['', 'none', none] }}"
                then:
                  - action: notify.send_message
                    continue_on_error: true
                    target:
                      entity_id: "{{ notify_ent }}"
                    data:
                      title: "{{ skip_title }}"
                      message: "{{ skip_message }}"
              - stop: "{{ skip_message }}"

          - alias: "Régler la zone"
            action: number.set_value
            target:
              entity_id: !input zone_number_entity
            data:
              value: !input zone_value

          - alias: "Régler la durée (budget + plancher/plafond)"
            action: number.set_value
            target:
              entity_id: !input duration_number_entity
            data:
              value: "{{ d_val }}"

          - alias: "Laisser le boîtier prendre en compte zone et durée"
            delay:
              seconds: 2

          - alias: "Mémoriser l'heure de la commande"
            variables:
              t_press_ts: "{{ as_timestamp(now()) }}"

          - alias: "Démarrer l'arrosage"
            action: button.press
            target:
              entity_id: !input start_button_entity

          # Le proxy attend la connexion BLE, vérifie et réessaie jusqu'à
          # 3 fois (≈ 6 min au pire) : on attend l'ouverture sur la même
          # durée. last_changed postérieur à la commande = ouverture
          # consécutive à CETTE commande, pas un état antérieur.
          - alias: "Confirmer l'ouverture de la vanne"
            if:
              - condition: template
                value_template: "{{ valve_entity_id | default('') not in ['', 'none', none] }}"
            then:
              - wait_template: >
                  {{ is_state(valve_entity_id, 'on')
                     and as_timestamp(states[valve_entity_id].last_changed, 0) >= t_press_ts | float(0) }}
                timeout:
                  minutes: 6
                continue_on_timeout: true
              - if:
                  - condition: template
                    value_template: "{{ not wait.completed }}"
                then:
                  - if:
                      - condition: template
                        value_template: "{{ notify_ent | default('') not in ['', 'none', none] }}"
                    then:
                      - action: notify.send_message
                        continue_on_error: true
                        target:
                          entity_id: "{{ notify_ent }}"
                        data:
                          title: "🚫 Arrosage non démarré"
                          message: "{{ msg_prefix }} la vanne ne s'est pas ouverte (boîtier injoignable ou commande refusée)."
                  - stop: "Ouverture de la vanne non confirmée."

          - alias: "Notifier le démarrage"
            if:
              - condition: template
                value_template: "{{ notify_succ and notify_ent | default('') not in ['', 'none', none] }}"
            then:
              - action: notify.send_message
                continue_on_error: true
                target:
                  entity_id: "{{ notify_ent }}"
                data:
                  title: "💧 Arrosage en cours"
                  message: >
                    {% if valve_entity_id | default('') not in ['', 'none', none] %}Vanne ouverte{% else %}Démarrage demandé{% endif %}
                    pour la Zone {{ z_val }} ({{ d_val }} minutes).

          - alias: "Suivre la fin de l'arrosage"
            if:
              - condition: template
                value_template: "{{ valve_entity_id | default('') not in ['', 'none', none] }}"
            then:
              - variables:
                  t_open_ts: "{{ as_timestamp(now()) }}"
              # Le boîtier coupe lui-même après d_val minutes ; 5 min de marge
              # couvrent les trous de connexion BLE avant remontée de l'état.
              - wait_template: "{{ is_state(valve_entity_id, 'off') }}"
                timeout:
                  minutes: "{{ d_val | int(1) + 5 }}"
                continue_on_timeout: true
              - if:
                  - condition: template
                    value_template: "{{ wait.completed }}"
                then:
                  - if:
                      - condition: template
                        value_template: "{{ notify_on_complete and notify_ent | default('') not in ['', 'none', none] }}"
                    then:
                      - action: notify.send_message
                        continue_on_error: true
                        target:
                          entity_id: "{{ notify_ent }}"
                        data:
                          title: "✅ Arrosage terminé"
                          message: >
                            Zone {{ z_val }} : vanne fermée après
                            {{ ((as_timestamp(now()) - t_open_ts | float(0)) / 60) | round(0) | int }} min
                            (prévu : {{ d_val }} min).
                else:
                  - alias: "Vanne restée ouverte : fermeture forcée"
                    action: button.press
                    target:
                      entity_id: !input stop_button_entity
                  - if:
                      - condition: template
                        value_template: "{{ notify_ent | default('') not in ['', 'none', none] }}"
                    then:
                      - action: notify.send_message
                        continue_on_error: true
                        target:
                          entity_id: "{{ notify_ent }}"
                        data:
                          title: "⚠️ Vanne toujours ouverte"
                          message: "Zone {{ z_val }} : vanne encore ouverte 5 min après la durée prévue ({{ d_val }} min), fermeture forcée demandée."
            else:
              - alias: "Notifier la fin après la durée (sans vérification)"
                if:
                  - condition: template
                    value_template: "{{ notify_on_complete and notify_ent | default('') not in ['', 'none', none] }}"
                then:
                  - delay:
                      minutes: "{{ d_val | int(1) }}"
                  - action: notify.send_message
                    continue_on_error: true
                    target:
                      entity_id: "{{ notify_ent }}"
                    data:
                      title: "✅ Arrosage terminé"
                      message: "Zone {{ z_val }} : cycle de {{ d_val }} min terminé."

      - conditions:
          - condition: trigger
            id: "stop"
        sequence:
          - alias: "Variables d'arrêt"
            variables:
              notify_ent: !input notify_entity
              notify_on_complete: !input notify_on_complete
              z_val: !input zone_value
              ble_entity_id: !input ble_sensor_entity

          - alias: "Attendre le BLE pour fermer la vanne (max 2 min)"
            if:
              - condition: template
                value_template: "{{ not is_state(ble_entity_id, 'on') }}"
            then:
              - wait_for_trigger:
                  - platform: state
                    entity_id: !input ble_sensor_entity
                    to: "on"
                    id: ble_on
                timeout:
                  minutes: 2
                continue_on_timeout: true

          - alias: "Fermer la vanne si BLE joignable"
            if:
              - condition: template
                value_template: "{{ is_state(ble_entity_id, 'on') }}"
            then:
              - action: button.press
                target:
                  entity_id: !input stop_button_entity
              - if:
                  - condition: template
                    value_template: "{{ notify_on_complete and notify_ent | default('') not in ['', 'none', none] }}"
                then:
                  - action: notify.send_message
                    continue_on_error: true
                    target:
                      entity_id: "{{ notify_ent }}"
                    data:
                      title: "🔒 Vanne fermée"
                      message: "Zone {{ z_val }} : fin de créneau, vanne fermée."
            else:
              - if:
                  - condition: template
                    value_template: "{{ notify_ent | default('') not in ['', 'none', none] }}"
                then:
                  - action: notify.send_message
                    continue_on_error: true
                    target:
                      entity_id: "{{ notify_ent }}"
                    data:
                      title: "📡 Fermeture impossible"
                      message: "Zone {{ z_val }} : boîtier injoignable en Bluetooth, la vanne n'a pas pu être fermée."
              - stop: "Fermeture impossible : BLE injoignable."

mode: restart
