# Proxy ESPHome — Rain Pure Vision 2.0 (2 zones) — appareil autonome
#
# Intégration BLE non officielle, construite par rétro-ingénierie de
# l'application officielle Rain Vision. Voir le README pour les détails,
# les limitations connues, et comment contribuer.
#
# Ce fichier décrit un ESP32 dédié. Toute la logique Rain Pure Vision est
# dans le package rain_pure_vision.yaml, téléchargé depuis GitHub à chaque
# compilation. Pour l'ajouter à un appareil ESPHome existant, copiez
# simplement les blocs substitutions: et packages: ci-dessous dans sa config.
#
# ⚠️ Pensez à :
#   1. Remplacer rain_mac par l'adresse MAC de VOTRE boîtier
#   2. Créer un secrets.yaml avec wifi_ssid / wifi_password /
#      ap_fallback_password / api_encryption_key (voir README)
#   3. Adapter rain_zones si votre boîtier n'a pas 2 zones

substitutions:
  rain_mac: "XX:XX:XX:XX:XX:XX" # <-- Remplacez par l'adresse MAC de votre boîtier
  rain_timezone: "Europe/Paris" # à adapter si nécessaire
  rain_zones: "2"

packages:
  rain_pure_vision:
    url: https://github.com/3615nulsi/esphome-rain-pure-vision
    ref: main # ou un tag de version (ex. v1.2.0) pour ne pas suivre main
    files: [rain_pure_vision.yaml] # + langues/en.yaml pour des noms d'entités en anglais
    refresh: 1d

esphome:
  name: proxy-arrosage
  friendly_name: Proxy Arrosage

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key
  homeassistant_services: true
  custom_services: true

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Proxy Arrosage Fallback Hotspot
    password: !secret ap_fallback_password

captive_portal:
